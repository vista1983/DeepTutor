name: Shanghai SSH connection check

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: shanghai-ssh-check
  cancel-in-progress: false

jobs:
  check:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    environment: shanghai
    steps:
      - name: Verify SSH configuration and connection
        shell: bash
        env:
          SSH_HOST: ${{ secrets.SHANGHAI_SSH_HOST }}
          SSH_PORT: ${{ secrets.SHANGHAI_SSH_PORT }}
          SSH_USER: ${{ secrets.SHANGHAI_SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SHANGHAI_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SHANGHAI_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          for name in SSH_HOST SSH_USER SSH_PRIVATE_KEY SSH_KNOWN_HOSTS; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing required setting: $name"
              exit 1
            fi
          done
          SSH_PORT="${SSH_PORT:-22}"
          [[ "$SSH_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]] || { echo "::error::Use an IPv4 address or DNS hostname"; exit 1; }
          [[ "$SSH_USER" =~ ^[a-zA-Z_][a-zA-Z0-9_-]*$ ]] || { echo "::error::Invalid SSH user"; exit 1; }
          [[ "$SSH_PORT" =~ ^[0-9]{1,5}$ ]] || { echo "::error::Invalid SSH port"; exit 1; }
          (( 10#$SSH_PORT >= 1 && 10#$SSH_PORT <= 65535 )) || { echo "::error::SSH port out of range"; exit 1; }
          SSH_PORT="$((10#$SSH_PORT))"
          umask 077
          keydir="$(mktemp -d "$RUNNER_TEMP/deeptutor-ssh.XXXXXX")"
          trap 'rm -f -- "$keydir/key" "$keydir/known_hosts"; rmdir -- "$keydir"' EXIT
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > "$keydir/key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" | tr -d '\r' > "$keydir/known_hosts"
          unset SSH_PRIVATE_KEY SSH_KNOWN_HOSTS
          ssh-keygen -y -P '' -f "$keydir/key" >/dev/null 2>&1 || {
            echo "::error::The deployment key must be valid and usable noninteractively"
            exit 1
          }
          timeout 45s ssh -F /dev/null -T \
            -i "$keydir/key" -p "$SSH_PORT" \
            -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$keydir/known_hosts" \
            -o GlobalKnownHostsFile=/dev/null \
            -o ConnectTimeout=15 -o ConnectionAttempts=1 \
            -o ServerAliveInterval=10 -o ServerAliveCountMax=2 \
            -o ClearAllForwardings=yes \
            "$SSH_USER@$SSH_HOST" 'printf "%s\n" DEEPTUTOR_SSH_OK' \
            | grep -Fx DEEPTUTOR_SSH_OK >/dev/null
          echo "SSH authentication and pinned host-key verification passed."
